<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Tech Mihandra</title>
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <div class="login-container">

        
        <div class="logo-container">
            <div class="logo-placeholder">No encontre el logo sin fondo</div>
        </div>

        <h2>Iniciar Sesión</h2>
        <p class="subtitulo">Accede a Tech Mihandra</p>

        <form>
            <div class="form-group">
                <label for="username">Usuario</label>
                <input type="text" id="username" name="username" placeholder="Tu usuario" required>
            </div>
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" placeholder="Tu contraseña" required>
            </div>
            <button type="submit" class="btn-ingresar" onclick="window.location.href='home.html'">Ingresar</button>
        </form>

        <p class="registro-link">¿No tienes cuenta? <a href="registro.html">Regístrate</a></p>
    </div>
</body>
</html>
